<!-- @startingPoint section="Prism" subtitle="AEO analytics — global brand/engine/region context, Overview + role-lens Prism with agent actions" viewport="1440x1024" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism — AI Visibility</title>
<link rel="icon" type="image/svg+xml" href="/assets/logos/prism-favicon.svg">
<style>
  /* Fonts from the Profound system (Inter / JetBrains Mono); graceful system fallback. */
  @font-face { font-family:"Inter"; font-weight:400; font-display:swap; src:url("../assets/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:500; font-display:swap; src:url("../assets/fonts/inter-500.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:600; font-display:swap; src:url("../assets/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:700; font-display:swap; src:url("../assets/fonts/inter-700.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:400; font-display:swap; src:url("../assets/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:500; font-display:swap; src:url("../assets/fonts/jetbrains-mono-500.woff2") format("woff2"); }

  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --text-primary: #0E0E10;
    --text-secondary: #6B6E76;
    --text-tertiary: #9A9DA4;
    --accent: #376CFF;
    --accent-hover: #2C5BE0;
    --blue-tint: rgba(55,108,255,0.12);
    --blue-ring: rgba(55,108,255,0.40);
    --green: #2E9E63;
    --amber: #B8860B;
    --red: #D24B4B;
    --red-tint: rgba(210,75,75,0.10);
    --surface-2: #EFEFF1;
    --border-subtle: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
    --duration-fast: 120ms;

    --topbar-h: 60px;
    --brandbar-h: 54px;
    --stick: 114px; /* topbar + brandbar */
    --prism-bar-ink: #2A2B30;
    --prism-page: #FBFBFC;
    --prism-hair: rgba(0,0,0,0.07);
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--prism-page); color: var(--text-primary); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  #root { min-height: 100%; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    height: var(--topbar-h); box-sizing: border-box;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; background: rgba(255,255,255,0.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .brand { display: flex; align-items: center; gap: 11px; flex: none; }
  .brand__mark { width: 26px; height: 26px; display: grid; place-items: center; color: var(--text-primary); }
  .brand__mark svg { width: 22px; height: 22px; }
  .brand__name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .brand__set { font-size: 11px; color: var(--text-tertiary); font-weight: 500; letter-spacing: 0.02em; margin-top: 2px; }
  .topbar__spacer { flex: 1; }

  /* context selectors */
  .selrow { display: flex; align-items: center; gap: 10px; flex: none; }
  .sel { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 30px 0 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: #fff; cursor: pointer; }
  .sel:hover { background: #FAFAFB; }
  .sel--brand { border-color: var(--accent); box-shadow: 0 0 0 3px var(--blue-tint); }
  .sel__k { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); }
  .sel__v { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .sel select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .sel__chev { position: absolute; right: 10px; color: var(--text-tertiary); pointer-events: none; display: flex; }
  .sel__chev svg { width: 13px; height: 13px; }
  .owntag { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); background: var(--blue-tint); border-radius: var(--radius-pill); padding: 2px 6px; }
  .snap { display: inline-flex; align-items: center; gap: 7px; flex: none; height: 28px; padding: 0 11px; border-radius: var(--radius-pill); border: 1px solid var(--border-subtle); background: var(--surface-2); font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  .snap__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .snap .num { font-size: 11.5px; color: var(--text-primary); }

  /* ---------- Nav (Overview | Prism) — segmented control in the top bar ---------- */
  .navset { display: inline-flex; flex: none; background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 3px; gap: 2px; }
  .navtab { height: 30px; padding: 0 16px; border: none; background: none; border-radius: 7px; font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: background var(--duration-fast), color var(--duration-fast); }
  .navtab:hover { color: var(--text-primary); }
  .navtab--active { background: #fff; color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  /* ---------- Brand bar — brand chips on the sub-layer below the top bar ---------- */
  .brandbar { position: sticky; top: var(--topbar-h); z-index: 45; height: var(--brandbar-h); display: flex; align-items: center; gap: 12px; padding: 0 24px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-subtle); }
  .brandbar__k { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); flex: none; }
  .bstrip { display: flex; align-items: center; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px; }
  .bstrip::-webkit-scrollbar { display: none; }
  .bchip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 7px; border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); background: #fff; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; flex: none; transition: border-color var(--duration-fast), background var(--duration-fast), color var(--duration-fast); }
  .bchip:hover { background: #FAFAFB; color: var(--text-primary); }
  .bchip--active { border-color: var(--accent); background: var(--blue-tint); color: var(--text-primary); font-weight: 600; }
  .bmono { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
  .bchip--plain { padding: 0 14px; }
  .bchip .owntag { margin-left: 1px; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px 96px; }
  .section { margin-top: 10px; }
  .section__head { position: sticky; top: var(--stick); z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 16px 0 12px; margin-bottom: 14px; background: var(--prism-page); border-bottom: 1px solid var(--border-subtle); }
  .section__title { display: flex; align-items: baseline; gap: 10px; }
  .section__title h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .section__count { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }

  .tiles { display: grid; gap: 16px; }
  .tiles--kpi { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .tiles--split { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); align-items: start; }
  .tiles--single { grid-template-columns: 1fr; }

  /* ---------- Tile ---------- */
  .tile { background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px 20px 16px; }
  .tile__title { font-size: 13px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tile__title .sub { font-size: 11px; font-weight: 500; color: var(--text-tertiary); }
  .tile__body { margin-bottom: 14px; }
  .tile__insight { display: flex; gap: 9px; font-size: 13px; color: var(--text-primary); line-height: 1.45; }
  .tile__insight .d { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
  .tile__caveat { font-size: 11.5px; color: var(--text-tertiary); margin-top: 7px; padding-left: 15px; line-height: 1.4; }

  .kpi__val { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi__label { font-size: 13px; color: var(--text-secondary); margin-top: 9px; }
  .kpi__cap { font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; }

  table.dt { width: 100%; border-collapse: collapse; }
  table.dt th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-tertiary); padding: 0 12px 9px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
  table.dt td { padding: 9px 12px; border-bottom: 1px solid var(--prism-hair); font-size: 13.5px; vertical-align: middle; }
  table.dt tr:last-child td { border-bottom: none; }
  table.dt td.n, table.dt th.n { text-align: right; }
  table.dt td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-primary); }
  table.dt td.rank { color: var(--text-tertiary); font-family: var(--font-mono); width: 28px; }
  table.dt td.lbl { font-weight: 500; }
  table.dt td.muted { color: var(--text-secondary); }
  table.dt tbody tr:hover { background: #FAFAFB; }
  tr.hl td { background: var(--blue-tint); }
  tr.hl:hover td { background: var(--blue-tint); }
  .tag { display: inline-block; margin-left: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; border-radius: var(--radius-pill); padding: 1px 7px; vertical-align: middle; white-space: nowrap; }
  .tag--owned { color: var(--accent); background: #fff; border: 1px solid var(--blue-ring); }
  .tag--sel { color: var(--accent); background: var(--blue-tint); }

  /* bars */
  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 14px; }
  .bar-row__lbl { font-size: 13px; color: var(--text-secondary); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row__track { display: flex; align-items: center; gap: 9px; }
  .bar-row__fill { height: 16px; border-radius: 3px; background: var(--prism-bar-ink); min-width: 2px; }
  .bar-row__val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--text-primary); flex: none; }

  .dleg { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .dleg span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary); }
  .dleg i { width: 11px; height: 11px; border-radius: 3px; }
  .drow { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 14px; padding: 6px 0; }
  .drow__lbl { font-size: 13px; color: var(--text-secondary); text-align: right; }
  .dchart { position: relative; }
  .dchart::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-strong); }
  .dbar-wrap { position: relative; height: 13px; margin: 2.5px 0; }
  .dbar { position: absolute; height: 100%; border-radius: 3px; min-width: 1px; }
  .dval { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-secondary); }
  .daxis { display: flex; justify-content: space-between; margin-top: 8px; padding-left: 184px; font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: var(--radius-pill); border: 1px solid var(--border-subtle); background: var(--surface-2); font-size: 13px; color: var(--text-primary); }
  .chip--risk { background: var(--red-tint); border-color: transparent; color: var(--red); }
  .chip--pos { background: rgba(46,158,99,0.10); border-color: transparent; color: var(--green); }

  /* empty */
  .empty { padding: 28px 16px; text-align: center; color: var(--text-tertiary); font-size: 13px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); }

  /* ---------- Prism role header ---------- */
  .role { background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px 22px; margin-top: 14px; }
  .role__top { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .role__pick { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 34px 0 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: #fff; cursor: pointer; }
  .role__pick:hover { background: #FAFAFB; }
  .role__pick select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .role__pick .sel__chev { right: 12px; }
  .role__name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .role__role { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .role__goal { font-size: 14px; color: var(--text-secondary); margin: 10px 0 14px; max-width: 760px; line-height: 1.5; }
  .qchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .qchip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: var(--radius-pill); background: var(--surface-2); font-size: 12.5px; color: var(--text-secondary); }
  .qchip .q { color: var(--accent); font-weight: 700; }

  .subtabs { display: flex; gap: 4px; margin: 18px 0 4px; border-bottom: 1px solid var(--border-subtle); }
  .subtab { position: relative; padding: 0 4px 10px; margin-right: 18px; background: none; border: none; cursor: pointer; font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; color: var(--text-tertiary); }
  .subtab:hover { color: var(--text-primary); }
  .subtab--active { color: var(--text-primary); }
  .subtab--active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }

  /* ---------- Action cards ---------- */
  .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin-top: 16px; }
  .act { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px 20px; }
  .act__title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .act__desc { font-size: 13px; color: var(--text-secondary); margin: 8px 0 12px; line-height: 1.45; flex: 1; }
  .act__inputs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .act__chip { font-size: 11.5px; color: var(--text-secondary); background: var(--surface-2); border-radius: var(--radius-pill); padding: 3px 9px; }
  .act__chip b { color: var(--text-primary); font-weight: 600; }
  .act__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .runstat { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; }
  .runstat--running { color: var(--accent); }
  .runstat--done { color: var(--green); }
  .statdot { width: 7px; height: 7px; border-radius: 50%; }
  .result { margin-top: 14px; border-top: 1px solid var(--border-subtle); padding-top: 14px; }
  .result__sum { font-size: 13.5px; color: var(--text-primary); line-height: 1.45; }
  .result__prev { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); background: var(--surface-2); border-radius: var(--radius-md); padding: 11px 13px; margin-top: 10px; white-space: pre-wrap; line-height: 1.55; }
  .result__meta { display: flex; align-items: center; gap: 10px; margin-top: 11px; font-size: 11.5px; color: var(--text-tertiary); }
  .result__id { font-family: var(--font-mono); }

  /* full-screen action run */
  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(14,14,16,0.42); backdrop-filter: blur(3px); display: flex; align-items: stretch; justify-content: center; padding: 28px; animation: modalin var(--duration-fast) ease-out; }
  @keyframes modalin { from { opacity: 0; } to { opacity: 1; } }
  .modal__panel { background: var(--prism-page); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(0,0,0,0.28); overflow: hidden; }
  .modal__head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); background: #fff; }
  .modal__head h2 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .modal__sub { font-size: 12.5px; color: var(--text-tertiary); }
  .modal__x { margin-left: auto; flex: none; width: 32px; height: 32px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: #fff; cursor: pointer; font-size: 15px; color: var(--text-secondary); line-height: 1; }
  .modal__x:hover { background: var(--surface-2); }
  .modal__body { padding: 22px 24px; overflow-y: auto; }
  .modal__foot { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-top: 1px solid var(--border-subtle); background: #fff; }
  .modal__foot .result__id { margin-right: auto; font-size: 11.5px; color: var(--text-tertiary); }
  .runblock { margin-top: 20px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; }
  .runblock__head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border-subtle); }
  .runblock__head h3 { font-size: 13.5px; font-weight: 650; margin: 0; }
  .runblock__cfg { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
  .runblock__report { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); white-space: pre-wrap; line-height: 1.6; padding: 14px 16px; }
  .badge { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: var(--radius-pill); padding: 2px 9px; }
  .badge--ok { color: var(--green); background: rgba(46,158,99,0.12); }
  .badge--run { color: var(--accent); background: var(--blue-tint); }
  .badge--err { color: var(--red); background: var(--red-tint); }
  .agentlink { color: var(--accent); text-decoration: none; }
  .agentlink:hover { text-decoration: underline; }
  .agentlink .ext { font-size: 11px; }
  .cite { font-size: 11px; color: var(--text-tertiary); padding: 8px 16px 0; }
  .cite code { font-family: var(--font-mono); font-size: 10.5px; background: var(--surface-2); border-radius: 4px; padding: 1px 5px; }
  .mh { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 60px 0; color: var(--text-secondary); }

  /* interactive tile controls (topic filters / sort / expandable rows) */
  .tctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
  .tpill { font-size: 12px; font-weight: 500; color: var(--text-secondary); background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); padding: 4px 11px; cursor: pointer; transition: all var(--duration-fast); }
  .tpill:hover { border-color: var(--border-strong); }
  .tpill--on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sortbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--blue-tint); border: none; border-radius: var(--radius-pill); padding: 5px 11px; cursor: pointer; }
  table.dt tr.clickable { cursor: pointer; }
  table.dt tr.clickable:hover { background: var(--blue-tint); }
  table.dt td .caret { color: var(--text-tertiary); font-size: 11px; }
  .promptlist { background: var(--surface-2); border-radius: var(--radius-md); padding: 10px 14px; margin: 4px 0 2px; }
  .promptlist li { font-size: 13px; color: var(--text-secondary); line-height: 1.5; padding: 3px 0; list-style: none; }
  .promptlist li:before { content: "·"; color: var(--text-tertiary); margin-right: 8px; }
  .netpos { color: var(--green); font-weight: 600; }
  .netneg { color: var(--red); font-weight: 600; }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 15px; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; white-space: nowrap; transition: background var(--duration-fast), border-color var(--duration-fast), opacity var(--duration-fast); }
  .btn--accent { background: var(--accent); color: #fff; }
  .btn--accent:hover { background: var(--accent-hover); }
  .btn--ghost { background: #fff; color: var(--text-primary); border-color: var(--border-strong); }
  .btn--ghost:hover { background: var(--surface-2); }
  .btn--sm { height: 30px; padding: 0 11px; font-size: 13px; }
  .btn:disabled { opacity: 0.55; cursor: default; }

<body>
<div id="root"></div>
<script type="text/babel">
/* =============================================================================
   Prism — AI Visibility (AEO) analytics · a Profound product
   Single point-in-time snapshot 2026-05-30 → 2026-06-06. NO trends, ever:
   no deltas, growth %, arrows, sparklines or time-series. Present-state only.

   GLOBAL CONTEXT  {brand, engine, region}  drives every view (Overview + Prism)
   and persists across views. The brand selected anywhere stays selected.

   DATA LAYER — one swappable module. Today returns mock data keyed by context;
   later maps to a backend:
       api.getOverview({brand, engine, region})        -> GET  /api/overview
       api.getPrism({role, brand, engine, region})     -> GET  /api/prism/<role>
       api.getActions({role, brand, engine, region})   -> GET  /api/prism/<role>/actions
       api.runAction(actionId, ctx)                     -> POST /api/actions/<id>/run
   Units: visibility_score / share_of_voice / citation_share are raw 0–1 → shown
   ×100 as %. average_position lower = better (1 first). visibility_rank /
   citation_rank: 1 = best, within the selected engine+region. sentiment net =
   positive − negative (weighted). citation_category ∈ {other, social,
   earned_media, earned_institutions, owned, competition, pr_wire}.
   No data is hardcoded inside components — everything flows from `api`.
   ========================================================================== */

const SNAPSHOT = { from: "2026-05-30", to: "2026-06-06" };

const BRAND_OPTIONS = ["ChatGPT", "Claude", "Gemini", "OpenAI", "Perplexity", "Copilot", "Llama", "Mistral", "Grok", "DeepSeek"];
const ENGINE_OPTIONS = ["ChatGPT", "Google Gemini", "Google AI Mode", "Google AI Overviews", "Perplexity", "Microsoft Copilot"];
const REGION_OPTIONS = ["United States", "United Kingdom", "Canada"];
const OWNED_BRAND = "ChatGPT";

/* base leaderboard — asset_name: [visibility_score%, share_of_voice%, avg_position, mentions] in ChatGPT / US */
const BRAND_BASE = {
  Claude:     [57.2, 24.1, 2.3, 4120],
  ChatGPT:    [49.8, 18.4, 2.9, 3380],
  Gemini:     [41.5, 15.2, 3.4, 2210],
  OpenAI:     [33.0, 11.8, 3.8, 1870],
  Perplexity: [22.6, 7.9, 4.5, 1290],
  Llama:      [18.1, 5.4, 5.1, 1110],
  Mistral:    [14.7, 4.2, 5.6, 980],
  Copilot:    [12.3, 3.1, 6.0, 760],
  Grok:       [9.8, 2.4, 6.4, 520],
  DeepSeek:   [7.1, 1.9, 6.9, 430],
};

const ENGINE_F = { "ChatGPT": 1.0, "Google Gemini": 0.92, "Google AI Mode": 0.86, "Google AI Overviews": 0.89, "Perplexity": 0.83, "Microsoft Copilot": 0.78 };
const REGION_F = { "United States": 1.0, "United Kingdom": 0.94, "Canada": 0.90 };

/* net sentiment by theme — base = Claude; other brands scaled by SENT_F */
const SENT_BASE = [
  ["Coherent Argumentation", 42, 310],
  ["Coding Ability", 38, 290],
  ["Reasoning Depth", 35, 275],
  ["Helpfulness", 30, 260],
  ["Writing Quality", 28, 240],
  ["Safety / Caution", 21, 200],
  ["Speed", -8, 180],
  ["Can Hallucinate and Err", -18, 220],
  ["Verbosity", -14, 160],
  ["Cost", -11, 150],
];
const SENT_F = { Claude: 1.0, ChatGPT: 0.92, Gemini: 0.83, OpenAI: 0.80, Perplexity: 0.78, Copilot: 0.74, Llama: 0.70, Mistral: 0.72, Grok: 0.60, DeepSeek: 0.66 };

const CITE_CATS = [
  ["social", 28.4], ["earned_media", 21.7], ["other", 18.2], ["owned", 13.5],
  ["earned_institutions", 9.1], ["competition", 5.8], ["pr_wire", 3.3],
];

/* root_domain, base count, owners[], topic beat */
const DOMAINS = [
  ["reddit.com", 4120, [], "Coding"],
  ["youtube.com", 3380, [], "Reviews"],
  ["medium.com", 2210, [], "Tutorials"],
  ["linkedin.com", 1870, [], "Careers"],
  ["openai.com", 1540, ["ChatGPT", "OpenAI"], "Docs"],
  ["arxiv.org", 1290, [], "Research"],
  ["github.com", 1110, [], "Code"],
  ["anthropic.com", 980, ["Claude"], "Docs"],
  ["techcrunch.com", 760, [], "News"],
  ["news.ycombinator.com", 690, [], "Community"],
  ["wikipedia.org", 640, [], "Reference"],
  ["substack.com", 520, [], "Opinion"],
  ["theverge.com", 470, [], "News"],
  ["stackoverflow.com", 430, [], "Code"],
  ["x.com", 390, [], "Social"],
];

/* prompts — available for the owned brand only (vw_prompt_overview) */
const PROMPTS = [
  ["best AI model for coding", "Coding", "capability", 62.1, 4.2, 11, 540],
  ["which AI reasons best on hard problems", "Reasoning", "capability", 58.7, 5.0, 10, 480],
  ["best AI for building autonomous agents", "Agents", "use-case", 55.3, 3.8, 12, 460],
  ["safest AI model", "Safety", "trust", 53.0, 6.1, 9, 420],
  ["cheapest frontier model API", "Pricing", "commercial", 51.4, 2.9, 13, 400],
  ["largest context window AI", "Context Window", "capability", 49.9, 4.5, 10, 380],
  ["best multimodal AI", "Multimodal", "capability", 48.2, 3.3, 12, 360],
  ["fastest AI model", "Speed", "capability", 46.7, 5.5, 8, 350],
  ["best AI for enterprise", "Enterprise", "commercial", 42.0, 4.8, 9, 320],
  ["most private AI assistant", "Privacy", "trust", 40.6, 2.7, 13, 300],
];

const CLUSTERS = [
  ["AI coding assistant", 6, 58],
  ["Autonomous agents", 4, 52],
  ["Research & reasoning", 5, 49],
  ["Writing & content", 4, 44],
  ["Enterprise deployment", 3, 41],
];
const ADJACENT = ["Does it support MCP tools?", "How does it handle long documents?", "Can it run offline?", "What's the rate limit?"];

const ATTRIBUTES = ["Thoughtful", "Safe", "Verbose", "Capable coder", "Strong reasoner", "Premium"];

/* ---- context-aware computation ---- */
function ctxFactor(engine, region) { return (ENGINE_F[engine] || 1) * (REGION_F[region] || 1); }

function leaderboard(engine, region) {
  const f = ctxFactor(engine, region);
  const rows = Object.keys(BRAND_BASE).map((name) => {
    const [vis, sov, pos, mentions] = BRAND_BASE[name];
    return {
      asset_name: name,
      visibility_score: +(vis * f).toFixed(1),
      share_of_voice: +(sov * f).toFixed(1),
      average_position: +(pos * (1 + (1 - f) * 0.6)).toFixed(1),
      mentions_count: Math.round(mentions * f),
    };
  });
  rows.sort((a, b) => b.visibility_score - a.visibility_score);
  rows.forEach((r, i) => (r.visibility_rank = i + 1));
  return rows;
}
function brandRow(brand, engine, region) {
  return leaderboard(engine, region).find((r) => r.asset_name === brand);
}
function sentimentFor(brand, engine, region) {
  const bf = (SENT_F[brand] || 0.7) * (0.6 + 0.4 * ctxFactor(engine, region));
  return SENT_BASE.map(([theme, net, occ]) => ({ theme, net: Math.round(net * bf), occurrences: Math.round(occ * bf) }))
    .sort((a, b) => b.occurrences - a.occurrences);
}
function citeFactor(brand, engine, region) {
  const r = brandRow(brand, engine, region);
  return r ? r.mentions_count / 4120 : 0.5;
}
function domainsFor(brand, engine, region) {
  const cf = citeFactor(brand, engine, region) * 1.0;
  return DOMAINS.map(([d, c, owners, beat]) => ({
    root_domain: d, count: Math.round(c * cf), owners, beat,
    owned: owners.includes(brand),
  }));
}
function categoriesFor(brand, engine, region) {
  const total = domainsFor(brand, engine, region).reduce((s, d) => s + d.count, 0);
  return CITE_CATS.map(([cat, share]) => ({ citation_category: cat, citation_share: share, count: Math.round((share / 100) * total) }));
}
function promptsFor(brand, engine, region) {
  if (brand !== OWNED_BRAND) return [];
  const f = ctxFactor(engine, region);
  return PROMPTS.map(([prompt, topic, tags, vis, cit, rank, vol]) => ({
    prompt, topic, tags,
    visibility_score: +(vis * f).toFixed(1),
    citation_share: +(cit * f).toFixed(1),
    citation_rank: rank,
    prompt_volume: Math.round(vol * f),
  }));
}

const clone = (x) => JSON.parse(JSON.stringify(x));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const ctxLabel = (c) => `${c.engine} · ${c.region}`;

// Fallback base for linking out to Profound (per-run deep links come from the API).
const PROFOUND_APP = "https://platform.tryprofound.com";

/* =============================================================================
   API
   ========================================================================== */
const api = {
  async getOverview({ brand, engine, region }) {
    await wait(180);
    const lb = leaderboard(engine, region);
    const me = lb.find((r) => r.asset_name === brand) || lb[0];
    const sent = sentimentFor(brand, engine, region);
    const cats = categoriesFor(brand, engine, region);
    const doms = domainsFor(brand, engine, region);
    const prompts = promptsFor(brand, engine, region);

    return {
      kpis: [
        { title: "Visibility Rank", value: "#" + me.visibility_rank, label: `within ${engine} / ${region}` },
        { title: "Visibility %", value: me.visibility_score + "%", label: "of tracked answers mention " + brand },
        { title: "Share of Voice %", value: me.share_of_voice + "%", label: "of all brand mentions" },
        { title: "Avg Position", value: me.average_position.toFixed(1), label: "average rank when mentioned", caption: "lower is better" },
      ],
      leaderboard: {
        type: "leaderboard", title: "Visibility Leaderboard — " + ctxLabel({ engine, region }),
        columns: ["Brand", "Visibility %", "Share of Voice %", "Avg Position", "Mentions"],
        brandKey: "asset_name",
        rows: lb.map((r) => [r.asset_name, r.visibility_score, r.share_of_voice, r.average_position, r.mentions_count]),
        highlight: brand,
        insight: `${lb[0].asset_name} leads visibility here; ${brand} sits at rank #${me.visibility_rank}.`,
        caveats: "visibility_rank within engine+region; avg position is better when lower (1 = first).",
      },
      sentiment: {
        type: "bar", title: "Net Sentiment by Theme — " + brand, subtitle: "top 10 themes by occurrences",
        columns: ["Theme", "Net"],
        rows: sent.map((s) => [s.theme, s.net]),
        meta: sent.map((s) => s.occurrences),
        metaLabel: "occ",
        insight: "Net = positive − negative. " + brand + " skews " + (sent.reduce((a, s) => a + s.net, 0) >= 0 ? "favourable overall." : "unfavourable overall."),
        caveats: "Themes grouped case-insensitively; only positive/negative exist (no neutral).",
      },
      catTile: {
        type: "bar", title: "Citations by Source Category", subtitle: ctxLabel({ engine, region }),
        columns: ["Category", "Citation Share %"],
        rows: cats.map((c) => [c.citation_category, c.citation_share]),
        insight: "Social and earned media dominate; owned domains are a minority of citations.",
        caveats: "citation_share shown ×100.",
      },
      domTile: {
        type: "leaderboard", title: "Top Cited Domains", subtitle: ctxLabel({ engine, region }),
        columns: ["Domain", "Citations", "Citation Share %"],
        brandKey: null,
        rows: doms.slice(0, 12).map((d) => [d.root_domain, d.count, +((d.count / doms.reduce((s, x) => s + x.count, 0)) * 100).toFixed(1)]),
        ownedDomains: doms.filter((d) => d.owned).map((d) => d.root_domain),
        insight: "Community and video platforms — Reddit and YouTube — are the heaviest citation sources.",
        caveats: "Raw counts within the selected engine + region.",
      },
      prompts: {
        type: "table", title: "Prompt Performance — where " + brand + " surfaces",
        columns: ["Prompt", "Topic", "Tags", "Visibility %", "Citation Share %", "Citation Rank", "Volume"],
        rows: prompts.map((p) => [p.prompt, p.topic, p.tags, p.visibility_score, p.citation_share, p.citation_rank, p.prompt_volume]),
        empty: prompts.length === 0,
        insight: prompts.length ? "High-visibility prompts with weak citation rank are your clearest content gaps." : null,
        caveats: "Prompt-level metrics are available for the owned brand (ChatGPT) in this snapshot; for other brands this section may be empty.",
      },
    };
  },

  async getPrism({ role, brand, engine, region }) {
    await wait(220);
    return { role: ROLES[role], tiles: buildRoleInsights(role, { brand, engine, region }) };
  },

  async getActions({ role }) {
    await wait(140);
    return { actions: clone(ACTIONS[role] || []) };
  },

  async runAction(actionId, ctx) {
    await wait(1300);
    const base = RUN_RESULTS[actionId] || { summary: "Action completed.", preview: "—" };
    const id = "run_" + Math.random().toString(16).slice(2, 6);
    return { runId: id, status: "done", summary: base.summary, preview: base.preview, seeded: ctx };
  },
};

/* ---- LIVE DATA -------------------------------------------------------------
   Override the mock api above with fetch calls to the Flask backend, which
   serves real data from profound.db (dashboard_server.py / dashboard_data.py).
   The mock implementation is kept above as an offline reference but is no
   longer called. Same shapes in, same shapes out — the components are unchanged.
   --------------------------------------------------------------------------- */
const qs = (c) => `?brand=${encodeURIComponent(c.brand)}&engine=${encodeURIComponent(c.engine)}&region=${encodeURIComponent(c.region)}`;
async function jget(path) { const r = await fetch(path); if (!r.ok) throw new Error(path + " → " + r.status); return r.json(); }
async function jpost(path, body) { const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); if (!r.ok) throw new Error(path + " → " + r.status); return r.json(); }
Object.assign(api, {
  getMeta: () => jget("/api/meta"),
  getOverview: (ctx) => jget("/api/overview" + qs(ctx)),
  getPrism: ({ role, ...ctx }) => jget("/api/prism/" + role + qs(ctx)),
  getActions: ({ role, ...ctx }) => jget("/api/prism/" + role + "/actions" + qs(ctx)),
  runAction: (actionId, ctx) => jpost("/api/actions/" + actionId + "/run", ctx),
});

/* =============================================================================
   Roles, role-insight builders, actions
   ========================================================================== */
const ROLES = {
  cmo:   { id: "cmo", name: "Commercial Director", short: "CMO", goal: "A weekly executive read on AI-search performance — only the 3–5 items worth a decision, not a data dump.", questions: ["What's the one number I should care about?", "Are competitors gaining share of voice?", "Is sentiment positive or negative overall?", "Any new ways customers describe the category?"] },
  seo:   { id: "seo", name: "Optimization Lead", short: "SEO", goal: "A board of citation opportunities, prioritised by potential traffic impact.", questions: ["Which root domains are cited that aren't ours?", "Which engines are we under-cited on?", "Which topics drive the most citations?"] },
  pm:    { id: "pm", name: "Product Manager", short: "PM", goal: "How AI describes the product, which use-case prompts surface it, and which adjacent questions go unanswered.", questions: ["Top use-cases where we show up?", "Which features does AI highlight?", "What adjacent questions don't we answer?", "Which competitors get recommended?"] },
  brand: { id: "brand", name: "Brand Lead", short: "Brand", goal: "A sentiment-first view of how AI characterises the brand versus competitors, theme by theme.", questions: ["How does our sentiment compare theme-by-theme?", "What attributes does AI associate with us?", "What positive themes do competitors win?"] },
  pr:    { id: "pr", name: "Earned Media Lead", short: "PR", goal: "A working list of third-party domains and authors covering the category that don't cite the brand, mapped to topic beats.", questions: ["Which third-party domains are cited most?", "Which aren't citing us?", "What source types dominate?", "Which domains own which topics?"] },
};
const ROLE_ORDER = ["cmo", "seo", "pm", "brand", "pr"];

function topComates(brand, engine, region, n) {
  return leaderboard(engine, region).filter((r) => r.asset_name !== brand).slice(0, n);
}

function buildRoleInsights(role, ctx) {
  const { brand, engine, region } = ctx;
  const lb = leaderboard(engine, region);
  const me = lb.find((r) => r.asset_name === brand) || lb[0];
  const sent = sentimentFor(brand, engine, region);
  const doms = domainsFor(brand, engine, region);
  const prompts = promptsFor(brand, engine, region);
  const totalCites = doms.reduce((s, d) => s + d.count, 0);

  if (role === "cmo") {
    const net = sent.reduce((a, s) => a + s.net, 0);
    return [
      { type: "kpi-strip", tiles: [
        { title: "The one number", value: "#" + me.visibility_rank, label: `visibility rank in ${engine} / ${region}`, caption: brand + " vs " + (lb.length - 1) + " competitors" },
        { title: "Visibility %", value: me.visibility_score + "%", label: "of answers mention " + brand },
        { title: "Share of Voice %", value: me.share_of_voice + "%", label: "of all brand mentions" },
        { title: "Sentiment", value: net >= 0 ? "Positive" : "Negative", label: "net across themes", caption: "net sum " + (net >= 0 ? "+" : "") + net },
      ]},
      { type: "leaderboard", title: "Visibility vs top competitors", columns: ["Brand", "Visibility %", "Share of Voice %"],
        rows: lb.slice(0, 5).map((r) => [r.asset_name, r.visibility_score, r.share_of_voice]), highlight: brand,
        insight: net >= 0 ? "Overall sentiment is favourable; visibility is the lever to push." : "Visibility holding, but overall sentiment is a watch-item.",
        caveats: "Top 5 of " + lb.length + " brands in this engine + region." },
      { type: "table", title: "Newest / emerging-theme prompts", columns: ["Prompt", "Topic", "Visibility %"],
        rows: (prompts.length ? prompts : promptsFor(OWNED_BRAND, engine, region)).slice(0, 4).map((p) => [p.prompt, p.topic, p.visibility_score]),
        insight: "New category language is forming around agents, privacy and context windows.",
        caveats: "Emerging = prompts new to this snapshot's tracked set." },
    ];
  }
  if (role === "seo") {
    const thirdParty = doms.filter((d) => !d.owned).slice(0, 8);
    const gap = (prompts.length ? prompts : promptsFor(OWNED_BRAND, engine, region)).slice().sort((a, b) => b.citation_rank - a.citation_rank).slice(0, 6);
    const byTopic = {};
    promptsFor(OWNED_BRAND, engine, region).forEach((p) => { byTopic[p.topic] = (byTopic[p.topic] || 0) + p.citation_share; });
    const topics = Object.keys(byTopic).map((t) => [t, +byTopic[t].toFixed(1)]).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const engines = ENGINE_OPTIONS.map((e) => [e, +(13.5 * ENGINE_F[e]).toFixed(1)]).sort((a, b) => b[1] - a[1]);
    return [
      { type: "leaderboard", title: "Third-party domains cited for the category", columns: ["Domain", "Citations", "Topic beat"],
        rows: thirdParty.map((d) => [d.root_domain, d.count, d.beat]),
        insight: "These domains rank for our category but aren't ours — citation-recovery targets.",
        caveats: "Excludes owned domains for " + brand + "." },
      { type: "table", title: "Owned-page citation gaps (keyword view)", columns: ["Prompt", "Topic", "Citation Rank", "Citation Share %"],
        rows: gap.map((p) => [p.prompt, p.topic, p.citation_rank, p.citation_share]), empty: gap.length === 0,
        insight: "High visibility but weak citation rank = pages to build or refresh first.",
        caveats: "Higher citation_rank is worse. Owned-brand prompts only." },
      { type: "table", title: "Engine citation coverage", columns: ["Engine", "Owned Citation Share %"],
        rows: engines, highlight: engine, highlightCol: 0,
        insight: "You're least cited on " + engines[engines.length - 1][0] + " — an under-served engine.",
        caveats: "Owned citation share by engine, current region." },
      { type: "bar", title: "Topic citation leaders", columns: ["Topic", "Citation Share %"],
        rows: topics, insight: "Safety and reasoning topics convert the most citations.", caveats: "Aggregated across owned-brand prompts." },
    ];
  }
  if (role === "pm") {
    return [
      { type: "table", title: "Use-case clusters where " + brand + " surfaces", columns: ["Cluster", "Member Prompts", "Avg Visibility %"],
        rows: CLUSTERS.map((c) => [c[0], c[1], c[2]]),
        insight: "Coding and agent clusters are where the product shows up most often.",
        caveats: "Prompts clustered by use-case theme." },
      { type: "chips", title: "Adjacent questions to answer", items: ADJACENT,
        insight: "AI is asked these next — gaps the product/docs could own.",
        caveats: "Adjacent = high-volume sub-questions with low owned coverage." },
      { type: "leaderboard", title: "Competitors most recommended", columns: ["Brand", "Visibility %", "Share of Voice %"],
        rows: topComates(brand, engine, region, 4).map((r) => [r.asset_name, r.visibility_score, r.share_of_voice]),
        insight: "These competitors get recommended alongside or instead of " + brand + ".",
        caveats: "Top competitors by visibility in this engine + region." },
    ];
  }
  if (role === "brand") {
    const comps = topComates(brand, engine, region, 2).map((r) => r.asset_name);
    const series = [brand, ...comps];
    const compSent = comps.map((c) => sentimentFor(c, engine, region));

    const risks = sent.filter((s) => s.net < 0).map((s) => s.theme);
    return [
      { type: "bar", title: "Net sentiment — " + brand + " vs competitors", columns: ["Theme", ...series],
        rows, insight: brand + " is characterised most favourably on its top themes; gaps show where rivals win.",
        caveats: "Net = positive − negative, by theme. Negative = unfavorable." },
      { type: "chips", title: "Attributes AI associates with " + brand, items: ATTRIBUTES, tone: "pos",
        insight: "Recurring descriptors lifted from positive-sentiment mentions.",
        caveats: "Derived from theme + adjective co-occurrence." },
      { type: "chips", title: "Reputation-risk themes", items: risks.length ? risks : ["None this snapshot"], tone: "risk",
        insight: risks.length ? "Negative-net themes to prepare responses for." : "No net-negative themes this snapshot.",
        caveats: "Themes with net sentiment below zero." },
    ];
  }
  if (role === "pr") {
    const thirdParty = doms.filter((d) => !d.owned);
    const notCiting = thirdParty.filter((d) => d.beat).slice(0, 6);
    const srcMix = categoriesFor(brand, engine, region);
    return [
      { type: "leaderboard", title: "Third-party domains by citations", columns: ["Domain", "Citations"],
        rows: thirdParty.slice(0, 10).map((d) => [d.root_domain, d.count]),
        insight: "The domains shaping category answers — your outreach universe.",
        caveats: "Excludes owned domains." },
      { type: "table", title: "Domain × topic beat map", columns: ["Domain", "Topic beat", "Citations"],
        rows: thirdParty.slice(0, 8).map((d) => [d.root_domain, d.beat, d.count]),
        insight: "Map each domain to the beat it owns before pitching.",
        caveats: "Beat = dominant topic the domain is cited for." },
      { type: "bar", title: "Source-type mix", columns: ["Category", "Citation Share %"],
        rows: srcMix.map((c) => [c.citation_category, c.citation_share]),
        insight: "Social and earned media dominate the citation mix.",
        caveats: "citation_share ×100." },
      { type: "table", title: "Domains not citing us", columns: ["Domain", "Topic beat", "Citations"],
        rows: notCiting.map((d) => [d.root_domain, d.beat, d.count]),
        insight: "Cited for the category but not for " + brand + " — prime outreach list.",
        caveats: "Citation-curated across all prompts." },
    ];
  }
  return [];
}

/* Citation constellation — a dynamic, hand-rolled force-directed graph.
   Brand sits at the centre as a sun; third-party source domains orbit as planets
   sized by citations, clustered by source group, with peer co-citation links.
   No external graph library — a small velocity-Verlet-ish sim rendered as SVG. */
const CONSTEL_W = 760, CONSTEL_H = 460;

function ConstellationTile({ tile }) {
  const svgRef = React.useRef(null);

  const [hover, setHover] = useState(null);

  // (re)build the simulation whenever the data changes
  useEffect(() => {
    const data = tile.nodes || [];
    const maxC = Math.max(1, ...data.map((n) => n.count));
    const nodes = data.map((n, i) => {
      const ga = GROUP_ANGLE[n.group] != null ? GROUP_ANGLE[n.group] : 0;
      const spread = ((i % 5) - 2) * 0.18;
      const r = 8 + 22 * Math.sqrt(n.count / maxC);
      const ax = cx + Math.cos(ga) * 165, ay = cy + Math.sin(ga) * 130;
      return {
        id: n.id, label: n.label, count: n.count, group: n.group, r,
        ax, ay,
        x: ax + Math.cos(ga + spread) * (40 + (i % 7) * 9),
        y: ay + Math.sin(ga + spread) * (40 + (i % 7) * 9),
        vx: 0, vy: 0,
      };
    });
    nodesRef.current = nodes;
    alphaRef.current = 1;
    cancelAnimationFrame(rafRef.current);
    const maxW = Math.max(1, ...(tile.edges || []).map((e) => e.weight));
    const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });

    const step = () => {
      const a = alphaRef.current;
      const ns = nodesRef.current;
      // pairwise repulsion + collision
      for (let i = 0; i < ns.length; i++) {
        const n = ns[i]; let fx = 0, fy = 0;
        for (let j = 0; j < ns.length; j++) {
          if (i === j) continue;
          const m = ns[j];
          let dx = n.x - m.x, dy = n.y - m.y, d2 = dx * dx + dy * dy || 0.01;
          const d = Math.sqrt(d2);
          const rep = (260 * (n.r + m.r)) / d2;
          fx += (dx / d) * rep; fy += (dy / d) * rep;
          const overlap = n.r + m.r + 6 - d;
          if (overlap > 0) { fx += (dx / d) * overlap * 0.5; fy += (dy / d) * overlap * 0.5; }
        }
        // mild gravity to keep the whole field framed + group-anchor clustering
        fx += (cx - n.x) * 0.006; fy += (cy - n.y) * 0.006;
        fx += (n.ax - n.x) * 0.016; fy += (n.ay - n.y) * 0.016;
        n._fx = fx; n._fy = fy;
      }
      // peer link springs (stronger co-citation pulls closer)
      (tile.edges || []).forEach((e) => {
        const s = byId[e.source], t = byId[e.target];
        if (!s || !t) return;
        const wn = e.weight / maxW;
        let dx = t.x - s.x, dy = t.y - s.y, d = Math.hypot(dx, dy) || 0.01;
        const restL = 70 + 110 * (1 - wn), k = 0.006 + 0.02 * wn;
        const f = ((d - restL) / d) * k;
        s._fx += dx * f; s._fy += dy * f; t._fx -= dx * f; t._fy -= dy * f;
      });
      // integrate (centre node is implicit — never moves)
      for (let i = 0; i < ns.length; i++) {
        const n = ns[i];
        if (dragRef.current === i) { n.vx = 0; n.vy = 0; continue; }
        n.vx = (n.vx + n._fx * a) * 0.82; n.vy = (n.vy + n._fy * a) * 0.82;
        n.x += n.vx; n.y += n.vy;
        const pad = n.r + 6;
        n.x = Math.max(pad, Math.min(CONSTEL_W - pad, n.x));
        n.y = Math.max(pad, Math.min(CONSTEL_H - pad, n.y));
      }
      alphaRef.current = a * 0.985;
      force((f) => f + 1);
      if (alphaRef.current > 0.02 || dragRef.current != null) { rafRef.current = requestAnimationFrame(step); }
      else { aliveRef.current = false; }
    };
    stepRef.current = step;
    aliveRef.current = true;
    rafRef.current = requestAnimationFrame(step);
    return () => { aliveRef.current = false; cancelAnimationFrame(rafRef.current); };
  }, [tile]);

  // (re)start the sim loop if it has cooled down
  const ensureAlive = () => {
    if (!aliveRef.current && stepRef.current) { aliveRef.current = true; rafRef.current = requestAnimationFrame(stepRef.current); }
  };
  const toLocal = (e) => {
    const svg = svgRef.current; const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  const onDown = (i) => (e) => { e.preventDefault(); dragRef.current = i; alphaRef.current = Math.max(alphaRef.current, 0.4); ensureAlive(); };
  const onMove = (e) => {
    if (dragRef.current == null) return;
    const p = toLocal(e); const n = nodesRef.current[dragRef.current];
    if (n) { n.x = p.x; n.y = p.y; n.vx = 0; n.vy = 0; }
    alphaRef.current = Math.max(alphaRef.current, 0.3); ensureAlive();
  };
  const onUp = () => { if (dragRef.current != null) { dragRef.current = null; alphaRef.current = Math.max(alphaRef.current, 0.4); ensureAlive(); } };

  const ns = nodesRef.current;
  const byId = {}; ns.forEach((n) => { byId[n.id] = n; });
  const empty = !ns.length;
  const maxEdgeW = Math.max(1, ...(tile.edges || []).map((x) => x.weight));

  return (
    <div className="tile">
      <TileHead tile={tile} />
      <div className="tile__body">
        <div className="constel-legend">
          {(tile.groups || []).map((g) => (
            <span key={g.id} className="constel-leg"><i style={{ background: g.color }} />{g.label}</span>
          ))}
          <span className="constel-leg constel-leg--hint">drag a planet · size = citations · link = co-citation</span>
        </div>
        {empty ? <div className="empty">No third-party citations for this engine + region.</div> : (
          <svg ref={svgRef} className="constel" viewBox={`0 0 ${CONSTEL_W} ${CONSTEL_H}`}
               onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={() => { onUp(); setHover(null); }}>
            <defs>
              {/* top-left highlight that turns a flat disc into a sphere */}
              <radialGradient id="constelSheen" cx="0.35" cy="0.30" r="0.7">
                <stop offset="0%" stopColor="#fff" stopOpacity="0.5" />
                <stop offset="42%" stopColor="#fff" stopOpacity="0.10" />
                <stop offset="100%" stopColor="#fff" stopOpacity="0" />
              </radialGradient>
              <filter id="constelShadow" x="-40%" y="-40%" width="180%" height="180%">
                <feDropShadow dx="0" dy="1" stdDeviation="1.4" floodColor="#0E0E10" floodOpacity="0.18" />
              </filter>
            </defs>
            {/* peer co-citation links */}
            {(tile.edges || []).map((e, i) => {
              const s = byId[e.source], t = byId[e.target];
              if (!s || !t) return null;
              const on = hover != null && (ns[hover].id === e.source || ns[hover].id === e.target);
              return <line key={"e" + i} x1={s.x} y1={s.y} x2={t.x} y2={t.y}
                           className={"constel-edge" + (on ? " constel-edge--on" : "")}
                           style={{ strokeWidth: 0.6 + 2.4 * (e.weight / maxEdgeW) }} />;
            })}
            {/* planets — every planet labelled */}
            {ns.map((n, i) => (
              <g key={"n" + i} transform={`translate(${n.x},${n.y})`}
                 className={"constel-node" + (hover === i ? " constel-node--on" : "")}
                 onMouseDown={onDown(i)} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
                <title>{n.label} · {n.count.toLocaleString("en-US")} citations</title>
                <circle className="constel-disc" r={n.r} style={{ fill: colorOf[n.group] || "var(--text-tertiary)" }} />
                <circle className="constel-sheen" r={n.r} fill="url(#constelSheen)" />
                <text className="constel-lbl" y={n.r + 10}>{n.label}</text>
              </g>
            ))}
          </svg>
        )}
      </div>
      <Insight tile={tile} />
    </div>
  );
}

function withBold(text) {
  // Render **significant bits** as <strong>; everything else stays plain text.
  return String(text).split(/(\*\*[^*]+\*\*)/g).map((p, i) =>
    p.startsWith("**") && p.endsWith("**")
      ? <strong key={i}>{p.slice(2, -2)}</strong>
      : <React.Fragment key={i}>{p}</React.Fragment>);
}

function TopicSentimentTile({ tile }) {
  const [worstFirst, setWorstFirst] = useState(true);
  const [open, setOpen] = useState(null); // expanded topic
  const rows = [...tile.rows].sort((a, b) => worstFirst ? a[1] - b[1] : b[1] - a[1]);

    <div className="tile">
      <TileHead tile={tile} />

        <div className="tctl">
          <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Click a topic to see its prompts</span>
          <button className="sortbtn" onClick={() => setWorstFirst((v) => !v)}>

          </button>
        </div>
        <table className="dt">
          <thead><tr>{tile.columns.map((c, i) => <th key={i} className={i === 0 ? "" : "n"}>{c}</th>)}</tr></thead>

              <React.Fragment key={ri}>

                  <td className="lbl"><span className="caret">{expanded ? "▾" : "▸"}</span> {t}</td>
                  <td className="n"><span className={net >= 0 ? "netpos" : "netneg"}>{net >= 0 ? "+" + net : net}</span></td>
                  <td className="n">{row[2]}</td>

                {expanded ? (
                  <tr><td colSpan={tile.columns.length} style={{ padding: "2px 12px 10px" }}>

function statusBadge(status) {
  const s = String(status || "").toLowerCase();
  if (s === "succeeded" || s === "done") return <span className="badge badge--ok">{status}</span>;
  if (s === "error" || s === "failed" || s === "cancelled" || s === "timeout") return <span className="badge badge--err">{status}</span>;
  return <span className="badge badge--run">{status}</span>;
}

function humanize(key) {
  return String(key).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

// Pick the best "title" field off a brief list-item object (broad fallback set).
function itemTitle(o) {
  return o.theme || o.title || o.name || o.action_title || o.learning || o.headline ||
         o.subject_line || o.domain || o.topic_name || o.target_url || null;
}
const TITLE_CANDIDATES = ["theme", "title", "name", "action_title", "learning", "headline", "subject_line", "domain", "topic_name", "target_url"];

// Recursively render any JSON value (string/number/array/object) without crashing.
function Val({ v }) {
  if (v == null || v === "") return null;
  if (Array.isArray(v)) return <ul style={{ margin: "3px 0 0", paddingLeft: 16 }}>{v.map((x, i) => <li key={i} style={{ fontSize: 12.5, color: "var(--text-secondary)", lineHeight: 1.5 }}><Val v={x} /></li>)}</ul>;
  if (typeof v === "object") return <div style={{ marginTop: 3 }}>{Object.entries(v).map(([k, val], i) => <KV key={i} k={k} v={val} />)}</div>;
  return <span style={{ whiteSpace: "pre-wrap" }}>{String(v)}</span>;
}

// One "Label: value" line — short scalars stay inline, long/nested values wrap below.
function KV({ k, v }) {
  if (v == null || v === "") return null;
  const label = <b style={{ color: "var(--text-tertiary)", fontWeight: 600 }}>{humanize(k)}:</b>;
  const long = (typeof v === "string" && (v.length > 60 || v.includes("\n"))) || (v && typeof v === "object");
  return (
    <div style={{ fontSize: 12.5, lineHeight: 1.5, marginTop: 4 }}>
      {label}{long ? null : <span> {String(v)}</span>}
      {long ? <div style={{ marginTop: 2, color: "var(--text-secondary)", whiteSpace: "pre-wrap" }}><Val v={v} /></div> : null}
    </div>
  );
}

function BriefSection({ title, items }) {
  return (
    <div style={{ marginTop: 16 }}>
      <h4 style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--text-tertiary)", margin: "0 0 8px" }}>{title}</h4>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {items.map((it, i) => {
          if (it && typeof it === "object") {
            const titleKey = TITLE_CANDIDATES.find((k) => typeof it[k] === "string" && it[k].trim());
            const t = titleKey ? it[titleKey] : null;
            const ev = it.evidence_sources || it.sources;
            const fields = Object.entries(it).filter(([k]) => k !== titleKey && k !== "evidence_sources" && k !== "sources");
            return (
              <div key={i} style={{ borderLeft: "2px solid var(--border-strong)", paddingLeft: 11 }}>
                {t ? <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 2 }}>{t}</div> : null}
                {fields.map(([k, v], j) => <KV key={j} k={k} v={v} />)}
                {Array.isArray(ev) && ev.length ? <div style={{ display: "flex", gap: 5, marginTop: 5 }}>{ev.map((s, j) => <span key={j} className="act__chip" style={{ fontSize: 10.5 }}>{String(s)}</span>)}</div> : null}
              </div>
            );
          }
          return <div key={i} style={{ fontSize: 13, color: "var(--text-secondary)", lineHeight: 1.5 }}>• {String(it)}</div>;
        })}
      </div>
    </div>
  );
}

function CSuiteBrief({ brief }) {
  // Header scalars → badge row; everything else renders in key order:
  // list → section, string → labeled paragraph (executive_summary unlabeled), dict → labeled block.
  const header = new Set(["brand", "topic_id", "overall_sentiment", "negative_sentiment_pct"]);
  const hide = new Set(["metadata", "cross_topic_patterns"]);   // not surfaced in the UI
  const sentiment = brief.overall_sentiment ? humanize(brief.overall_sentiment) : null;
  const pct = brief.negative_sentiment_pct;
  const labeledBlock = (k, body) => (
    <div key={k} style={{ marginTop: 16 }}>
      <h4 style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--text-tertiary)", margin: "0 0 6px" }}>{humanize(k)}</h4>
      {body}
    </div>
  );
  return (
    <div style={{ padding: "14px 16px" }}>
      {(sentiment || pct != null) ? (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          {sentiment ? <span className="badge badge--err">{sentiment}</span> : null}
          {pct != null ? <span style={{ fontSize: 12.5, color: "var(--text-secondary)" }}>{pct}% negative</span> : null}
        </div>
      ) : null}
      {Object.keys(brief).map((k) => {
        if (header.has(k) || hide.has(k)) return null;
        const v = brief[k];
        if (Array.isArray(v) && v.length) return <BriefSection key={k} title={humanize(k)} items={v} />;
        if (typeof v === "string" && v.trim()) {
          if (k === "executive_summary") return <p key={k} style={{ fontSize: 13.5, lineHeight: 1.55, margin: 0, color: "var(--text-primary)" }}>{v}</p>;
          return labeledBlock(k, <p style={{ fontSize: 13.5, lineHeight: 1.55, margin: 0, color: "var(--text-secondary)" }}>{v}</p>);
        }
        if (v && typeof v === "object" && Object.keys(v).length) return labeledBlock(k, <Val v={v} />);
        return null;
      })}
    </div>
  );
}

function AgentRunBlock({ a }) {

function ActionCard({ action, ctx, highlight }) {
  const [run, setRun] = useState(null); // null | "running" | result
  const ref = React.useRef(null);
  const isHi = highlight && highlight === action.id;
  const inputChips = action.inputChips || action.inputs || [];
  const built = action.built !== false;
  const cachedAction = !!action.cached;   // backend says a cached run exists
  const launch = async (force) => {
    if (!built) return;
    setRun("running");
    const r = await api.runAction(action.id, { ...(action.inputs || {}), region: ctx.region, force: !!force });
    setRun(r);
  };
  // Cached actions load their result immediately (no click). Summary-click also pre-runs.
  React.useEffect(() => {
    if (cachedAction && built && !run) launch(false);
  }, [cachedAction, action.id]);
  React.useEffect(() => {
    if (isHi && ref.current) ref.current.scrollIntoView({ behavior: "smooth", block: "center" });
    if (isHi && built && !run) launch(false);
  }, [highlight]);
  const done = run && run !== "running";
  const showResult = cachedAction || done;        // never offer "Run agent" for cached
  return (
    <div className="act" ref={ref} style={isHi ? { boxShadow: "0 0 0 2px var(--accent)", borderColor: "var(--accent)" } : null}>
      <div className="act__title" style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {action.team ? <span className="chip" style={{ fontSize: 10, fontWeight: 700 }}>{action.team}</span> : null}
        <span>{action.title}</span>
        <span style={{ marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--text-tertiary)", fontWeight: 600 }}>
          <span className="statdot" style={{ background: built ? "var(--green)" : "var(--text-tertiary)" }} />{built ? "Built" : "Not built"}
        </span>
      </div>
      <div className="act__desc">{withBold(action.desc)}</div>
      <div className="act__inputs">{inputChips.map((inp, i) => <span key={i} className="act__chip"><b>{inp[0]}</b> {inp[1]}</span>)}</div>
      <div className="act__foot">
        {run === "running" ? <span className="runstat runstat--running"><span className="spin"><SpinIcon /></span> {cachedAction ? "Loading…" : "Running agent…"}</span>
          : done ? <span className="runstat runstat--done"><span className="statdot" style={{ background: "var(--green)" }} /> {run.agentRun && run.agentRun.cached ? "Cached result" : "Agent run complete"}</span>
          : cachedAction ? <span style={{ fontSize: 12.5, color: "var(--text-tertiary)" }}>Loading cached result…</span>
          : <span style={{ fontSize: 12.5, color: "var(--text-tertiary)" }}>{built ? "Ready · " + inputChips.length + " input set(s)" : "Awaiting Profound graph"}</span>}
        {showResult ? <button className="btn btn--ghost btn--sm" onClick={() => launch(true)} disabled={run === "running"}>Refresh (live)</button>
          : <button className="btn btn--accent btn--sm" onClick={() => launch(false)} disabled={run === "running" || !built}>Run agent <ArrowIcon /></button>}
      </div>
      {run === "running" ? (
        <div className="result"><div style={{ display: "flex", alignItems: "center", gap: 9, color: "var(--text-secondary)", fontSize: 13 }}>
          <span className="spin"><SpinIcon /></span> {cachedAction ? "Loading cached result…" : "Running the agent… a first (uncached) run can take ~40s."}
        </div></div>
      ) : done ? <RunResult run={run} /> : null}
    </div>
  );
}

function PrismView({ ctx, role, setRole }) {
  const [tab, setTab] = useState("insights");
  const [insights, setInsights] = useState(null);
  const [actions, setActions] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [highlight, setHighlight] = useState(null);
  const roleMeta = ROLES[role];

  // A summary action was clicked: jump to Actions and pre-load that agent's card.
  const goAction = useCallback((agent) => { setHighlight(agent); setTab("actions"); }, []);

  const load = useCallback((spin) => {
    if (spin) setRefreshing(true);
    api.getPrism({ role, ...ctx }).then((d) => { setInsights(d.tiles); setRefreshing(false); });
    api.getActions({ role, ...ctx }).then((d) => setActions(d.actions));
  }, [role, ctx.brand, ctx.engine, ctx.region]);
  useEffect(() => { load(false); }, [load]);

  return (
    <div className="wrap">
      <div className="role">
        <div className="role__top">
          <label className="role__pick">
            <span className="role__role">Role</span>
            <span className="role__name">{roleMeta.name}</span>
            <span className="sel__chev"><Chev /></span>
            <select value={role} onChange={(e) => setRole(e.target.value)}>
              {ROLE_ORDER.map((r) => <option key={r} value={r}>{ROLES[r].name} ({ROLES[r].short})</option>)}
            </select>
          </label>
          <span className="snap"><span className="snap__dot" />{ctx.brand} · {ctxLabel(ctx)}</span>
        </div>
      </div>

      <div className="subtabs">
        <button className={"subtab" + (tab === "insights" ? " subtab--active" : "")} onClick={() => setTab("insights")}>Insights</button>
        <button className={"subtab" + (tab === "actions" ? " subtab--active" : "")} onClick={() => setTab("actions")}>Actions</button>
      </div>

      {tab === "insights" ? (
        <div>
          <div className="section__head" style={{ top: "var(--stick)" }}>
            <div className="section__title"><h2>{roleMeta.short} insights</h2><span className="section__count">{insights ? insights.length + " tiles" : ""}</span></div>
            <button className="btn btn--ghost btn--sm" onClick={() => load(true)} disabled={refreshing}>{refreshing ? <span className="spin"><SpinIcon /></span> : <RefreshIcon />}{refreshing ? "Refreshing" : "Refresh"}</button>
          </div>
          <div className="tiles tiles--single" style={refreshing ? { opacity: 0.5 } : null}>
            {insights ? insights.map((t, i) => <Tile key={i} tile={t} onAction={goAction} />) : <Skeleton />}
          </div>
        </div>
      ) : (
        <div>
          <div className="section__head" style={{ top: "var(--stick)" }}><div className="section__title"><h2>{roleMeta.short} actions</h2><span className="section__count">spin off downstream agents</span></div></div>
          <div className="acts">{actions ? actions.map((a) => <ActionCard key={a.id} action={a} ctx={ctx} highlight={highlight} />) : <Skeleton rows={3} />}</div>
        </div>
      )}
    </div>
  );
}

/* =============================================================================
   Selectors + App
   ========================================================================== */
function Selector({ k, value, options, onChange, brand }) {
  return (
    <label className={"sel" + (brand ? " sel--brand" : "")}>
      <span className="sel__k">{k}</span>
      <span className="sel__v">{value}</span>
      {brand && value === OWNED_BRAND ? <span className="owntag">Owned</span> : null}
      <span className="sel__chev"><Chev /></span>
      <select value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => <option key={o} value={o}>{o}{brand && o === OWNED_BRAND ? " (owned)" : ""}</option>)}
      </select>
    </label>
  );
}

function App() {
  const [meta, setMeta] = useState(null);
  const [view, setView] = useState("overview");
  const [brand, setBrand] = useState(null);
  const [engine, setEngine] = useState(null);
  const [region, setRegion] = useState(null);
  const [role, setRole] = useState("cmo");

  useEffect(() => {
    api.getMeta().then((m) => {
      setMeta(m);
      setBrand(m.defaults.brand);
      setEngine(m.defaults.engine);
      setRegion(m.defaults.region);
    });
  }, []);

  if (!meta || !brand) {
    return (
      <header className="topbar">
        <div className="brand">
          <span className="brand__mark"><PrismMark /></span>
          <span><span className="brand__name">Prism</span><span className="brand__set" style={{ display: "block" }}>AI Visibility · Frontier Models</span></span>
        </div>
        <div className="topbar__spacer" />
        <span className="snap"><span className="snap__dot" />loading snapshot…</span>
      </header>
    );
  }

  const ctx = { brand, engine, region };
  return (
    <React.Fragment>
      <header className="topbar">
        <div className="brand">
          <span className="brand__mark"><PrismMark /></span>
          <span><span className="brand__name">Prism</span><span className="brand__set" style={{ display: "block" }}>AI Visibility · Frontier Models</span></span>
        </div>
        <div className="navset">
          <button className={"navtab" + (view === "overview" ? " navtab--active" : "")} onClick={() => setView("overview")}>Overview</button>
          <button className={"navtab" + (view === "prism" ? " navtab--active" : "")} onClick={() => setView("prism")}>Prism</button>
        </div>
        <div className="topbar__spacer" />
        <div className="selrow">
          <Selector k="Brand" value={brand} options={meta.brands} onChange={setBrand} brand />
          <Selector k="Region" value={region} options={meta.regions} onChange={setRegion} />
          <span className="snap"><span className="snap__dot" />snapshot <span className="num">{meta.snapshot.from}</span> → <span className="num">{meta.snapshot.to}</span></span>
        </div>
      </header>

      <div className="brandbar">
        <span className="brandbar__k">Engine</span>
        <div className="bstrip">
          {meta.engines.map((e) => {
            const m = engineMono(e);
            return (
              <button key={e} className={"bchip" + (engine === e ? " bchip--active" : "")} onClick={() => setEngine(e)}>
                <span className="bmono" style={{ background: m.c }}>{m.i}</span>
                {e}
              </button>
            );
          })}
        </div>
      </div>

      {view === "overview" ? <OverviewView ctx={ctx} /> : <PrismView ctx={ctx} role={role} setRole={setRole} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
